name: linux

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ dev ]

jobs:
  perl:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        threaded: [ true, false ]
        perl-version:
          - '5.16'
          - '5.26'
          - '5.28'
          - '5.30'
          - '5.32'
          - '5.34'
          - '5.36'
          - '5.38'
          - '5.40'
          - '5.42'
          - '5'
        target:
          - { name: Linux, os: ubuntu-latest, triple: x86_64-unknown-linux-gnu }

    steps:
      - uses: actions/checkout@v4
        with:
          path: 'lib/YATT'
      - name: Set up Perl ${{ matrix.perl-version }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
          multi-thread: ${{ matrix.threaded }}
      - name: Install Dependencies
        working-directory: 'lib/YATT'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zsh build-essential libaio-dev libperl-dev
          cpm install -g Test::Requires B::Debug
          cpm install -g --show-build-log-on-failure --with-recommends --with-test
      - name: Run Tests
        run: PERL=$(which perl) lib/YATT/t/runtests.zsh
